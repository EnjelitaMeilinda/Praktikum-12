<!DOCTYPE html>
<html>
<head>
    <title>Add profile</title>
</head>
<body>
    <form method="post" action="prosesForm.php">
        <table border="1" cellpadding="10" cellspacing="0">
            <tr bgcolor="#dddddd">
                <th colspan="2" align="center">Add profile</th>
            </tr>
            <tr>
                <td>Name</td>
                <td><input type="text" name="nama" size="30"></td>
            </tr>
            <tr>
                <td>Position</td>
                <td>
                    <select name="posisi">
                        <option selected>Programmer</option>
                        <option>Senior Programmer</option>
                        <option>Junior Programmer</option>
                        <option>System Analyst</option>
                        <option>Senior Analyst</option>
                        <option>Junior Analyst</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="password" size="30"></td>
            </tr>
            <tr>
                <td>Confirm Password</td>
                <td><input type="password" name="confirm" size="30"></td>
            </tr>
            <tr>
                <td colspan="2" align="right">
                    <input type="reset" value="Reset">
                    <input type="submit" value="Save">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
